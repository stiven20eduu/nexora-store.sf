name: Build PWA icons

on:
  push:
    branches:
      - main
    paths:
      - "Emblema Nexora Store SF con corona.png"
      - ".github/workflows/build-pwa-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Rebuild icon-192.png
        run: |
          python - <<'PY'
          from PIL import Image
          src = Image.open("Emblema Nexora Store SF con corona.png").convert("RGB")
          icon = src.resize((192, 192), Image.Resampling.LANCZOS)
          icon.save("icon-192.png", "PNG", optimize=True)
          check = Image.open("icon-192.png")
          assert check.size == (192, 192)
          check.verify()
          print("icon-192.png OK")
          PY

      - name: Build icon-512.png
        run: |
          python - <<'PY'
          from PIL import Image
          src = Image.open("Emblema Nexora Store SF con corona.png").convert("RGB")
          icon = src.resize((512, 512), Image.Resampling.LANCZOS)
          icon.save("icon-512.png", "PNG", optimize=True)
          check = Image.open("icon-512.png")
          assert check.size == (512, 512)
          check.verify()
          print("icon-512.png OK")
          PY

      - name: Update manifest.json to PNG icons
        run: |
          python - <<'PY'
          import json
          path = "manifest.json"
          with open(path, "r", encoding="utf-8") as f:
              manifest = json.load(f)

          manifest["icons"] = [
              {
                  "src": "icon-192.png",
                  "sizes": "192x192",
                  "type": "image/png",
                  "purpose": "any maskable"
              },
              {
                  "src": "icon-512.png",
                  "sizes": "512x512",
                  "type": "image/png",
                  "purpose": "any maskable"
              }
          ]

          with open(path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print("manifest.json OK")
          PY

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix PWA PNG icons and manifest"
            git push
          fi
