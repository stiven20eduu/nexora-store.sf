<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iniciar sesión — NEXORA STORE</title>
  <link rel="icon" type="image/png" href="nexora-logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        #050608 url("login-bg.png")
        left center / cover
        no-repeat fixed;

      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .panel {
      width: 47%;
      min-height: 100vh;

      background: rgba(5, 7, 10, 0.96);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px 6%;

      box-shadow:
        -25px 0 80px rgba(0, 0, 0, 0.55);
    }

    .box {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 28px;
    }

    .brand img {
      width: 42px;
      height: 42px;

      border-radius: 50%;
      object-fit: cover;
    }

    .brand span {
      font-size: 18px;
      font-weight: 800;
    }

    h1 {
      text-align: center;
      font-size: 34px;

      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #8e95a3;
      font-size: 14px;

      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;

      color: #b8beca;
      font-size: 13px;

      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      height: 52px;

      padding: 0 16px;

      border: 1px solid #303642;
      border-radius: 11px;

      background: #11141a;
      color: white;

      outline: none;
      font-size: 15px;
    }

    .field input:focus {
      border-color: #f26822;

      box-shadow:
        0 0 0 3px rgba(242, 104, 34, 0.12);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 12px;

      margin: 7px 0 18px;

      font-size: 12px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;

      color: #aab0bb;
    }

    .row a,
    .register-link a {
      color: white;

      text-decoration: none;
      font-weight: 700;
    }

    .row a:hover,
    .register-link a:hover {
      text-decoration: underline;
    }

    .primary,
    .google {
      width: 100%;
      height: 52px;

      border-radius: 11px;

      font-weight: 800;
      font-size: 14px;

      cursor: pointer;
    }

    .primary {
      border: 0;

      background: #f26822;
      color: white;
    }

    .primary:hover {
      filter: brightness(1.08);
    }

    .primary:disabled,
    .google:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .or {
      display: flex;
      align-items: center;

      gap: 12px;

      color: #707785;
      font-size: 12px;

      margin: 20px 0;
    }

    .or::before,
    .or::after {
      content: "";

      height: 1px;

      background: #282d36;

      flex: 1;
    }

    .google {
      border: 1px solid #303642;

      background: #11141a;
      color: white;
    }

    .register-link {
      text-align: center;

      color: #808795;
      font-size: 13px;

      margin-top: 24px;
    }

    .message {
      min-height: 20px;

      text-align: center;

      color: #ffae74;

      font-size: 13px;

      margin-bottom: 10px;
    }

    @media (max-width: 900px) {

      body {
        background: #080a0f;
      }

      .panel {
        width: 100%;
        min-height: 100vh;

        box-shadow: none;

        padding: 32px 7%;
      }

      .brand {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <section class="panel">

    <div class="box">

      <div class="brand">
        <img
          src="nexora-logo.png"
          alt="NEXORA STORE"
        >

        <span>
          NEXORA STORE
        </span>
      </div>


      <h1>
        Inicio de sesión
      </h1>


      <p class="subtitle">
        Accede a tu cuenta de NEXORA STORE.
      </p>


      <form id="loginForm">

        <div class="field">

          <label for="email">
            Correo electrónico
          </label>

          <input
            id="email"
            type="email"
            placeholder="Correo electrónico"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Contraseña
          </label>

          <input
            id="password"
            type="password"
            placeholder="Contraseña"
            autocomplete="current-password"
            required
          >

        </div>


        <div class="row">

          <label class="remember">

            <input
              type="checkbox"
            >

            Recordarme

          </label>


          <a
            href="#"
            id="forgotPassword"
          >
            ¿Olvidaste tu contraseña?
          </a>

        </div>


        <div
          id="message"
          class="message"
          aria-live="polite"
        ></div>


        <button
          class="primary"
          id="loginButton"
          type="submit"
        >
          Iniciar sesión
        </button>

      </form>


      <div class="or">
        O
      </div>


      <button
        class="google"
        id="googleButton"
        type="button"
      >
        🔵 &nbsp; Continuar con Google
      </button>


      <p class="register-link">

        ¿Aún no tienes cuenta?

        <a href="register.html">
          Regístrate gratis
        </a>

      </p>

    </div>

  </section>



  <script type="module">

    import {
      signInWithEmailAndPassword,
      signInWithPopup,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      auth,
      googleProvider
    } from "./firebase.js";


    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const googleButton =
      document.getElementById("googleButton");

    const forgotPassword =
      document.getElementById("forgotPassword");

    const message =
      document.getElementById("message");


    function showMessage(text) {

      message.textContent = text;

    }


    function firebaseError(error) {

      switch (error.code) {

        case "auth/invalid-credential":
          return "Correo o contraseña incorrectos.";

        case "auth/invalid-email":
          return "El correo electrónico no es válido.";

        case "auth/user-disabled":
          return "Esta cuenta está deshabilitada.";

        case "auth/too-many-requests":
          return "Demasiados intentos. Espera un momento.";

        case "auth/popup-closed-by-user":
          return "La ventana de Google fue cerrada.";

        case "auth/popup-blocked":
          return "El navegador bloqueó la ventana de Google.";

        default:
          return "No se pudo iniciar sesión.";
      }

    }


    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        showMessage("");

        loginButton.disabled = true;

        try {

          await signInWithEmailAndPassword(
            auth,
            emailInput.value.trim(),
            passwordInput.value
          );

          window.location.href =
            "index.html";

        } catch (error) {

          showMessage(
            firebaseError(error)
          );

        } finally {

          loginButton.disabled = false;

        }

      }
    );


    googleButton.addEventListener(
      "click",
      async () => {

        showMessage("");

        googleButton.disabled = true;

        try {

          await signInWithPopup(
            auth,
            googleProvider
          );

          window.location.href =
            "index.html";

        } catch (error) {

          showMessage(
            firebaseError(error)
          );

        } finally {

          googleButton.disabled = false;

        }

      }
    );


    forgotPassword.addEventListener(
      "click",
      async (event) => {

        event.preventDefault();

        const email =
          emailInput.value.trim();


        if (!email) {

          showMessage(
            "Escribe tu correo primero."
          );

          emailInput.focus();

          return;
        }


        try {

          await sendPasswordResetEmail(
            auth,
            email
          );

          showMessage(
            "Te enviamos un correo para recuperar tu contraseña."
          );

        } catch (error) {

          showMessage(
            "No pudimos enviar el correo de recuperación."
          );

        }

      }
    );

  </script>

</body>
</html>
