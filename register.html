<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta - NEXORA STORE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b10;
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: #15151d;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      border: 1px solid #262633;
    }

    .logo {
      display: block;
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin: 0 auto 15px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      color: #ddd;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #30303c;
      border-radius: 10px;
      background: #0f0f15;
      color: white;
      outline: none;
      margin-bottom: 17px;
      font-size: 15px;
    }

    input:focus {
      border-color: #7c3aed;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      transition: 0.2s;
    }

    .register-btn {
      background: #7c3aed;
      color: white;
      margin-top: 5px;
    }

    .register-btn:hover {
      background: #6d28d9;
    }

    .google-btn {
      margin-top: 12px;
      background: white;
      color: #111;
    }

    .google-btn:hover {
      background: #eeeeee;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      color: #777;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #30303c;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
    }

    .error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #ff8080;
    }

    .success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #71e49a;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      color: #999;
      font-size: 14px;
    }

    .login-link a {
      color: #8b5cf6;
      text-decoration: none;
      font-weight: bold;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Logo -->
    <img src="nexora-logo.png" class="logo" alt="NEXORA STORE">

    <h1>Crear cuenta</h1>
    <p class="subtitle">Únete a NEXORA STORE</p>

    <!-- Nombre -->
    <label for="name">Nombre</label>
    <input
      type="text"
      id="name"
      placeholder="Tu nombre"
      autocomplete="name"
    >

    <!-- Correo -->
    <label for="email">Correo electrónico</label>
    <input
      type="email"
      id="email"
      placeholder="ejemplo@gmail.com"
      autocomplete="email"
    >

    <!-- Contraseña -->
    <label for="password">Contraseña</label>
    <input
      type="password"
      id="password"
      placeholder="Mínimo 6 caracteres"
      autocomplete="new-password"
    >

    <!-- Confirmar contraseña -->
    <label for="confirmPassword">Confirmar contraseña</label>
    <input
      type="password"
      id="confirmPassword"
      placeholder="Repite tu contraseña"
      autocomplete="new-password"
    >

    <!-- Crear cuenta -->
    <button class="btn register-btn" id="registerBtn">
      Crear cuenta
    </button>

    <div class="divider">o</div>

    <!-- Google -->
    <button class="btn google-btn" id="googleBtn">
      Continuar con Google
    </button>

    <!-- Mensajes -->
    <div id="message" class="message"></div>

    <!-- Login -->
    <div class="login-link">
      ¿Ya tienes una cuenta?
      <a href="login.html">Inicia sesión</a>
    </div>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    // Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    // CONFIGURACIÓN DE FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyCW0MCzgikzsGGfy4MU7tCrDlAuS1RKnhs",
      authDomain: "nexora-store-6857a.firebaseapp.com",
      projectId: "nexora-store-6857a",
      storageBucket: "nexora-store-6857a.firebasestorage.app",
      messagingSenderId: "868281016747",
      appId: "1:868281016747:web:a9afa4397d0e883581b2ee",
      measurementId: "G-77DG50FEW8"
    };


    // INICIAR FIREBASE
    const app = initializeApp(firebaseConfig);

    // INICIAR AUTHENTICATION
    const auth = getAuth(app);


    // GOOGLE
    const provider = new GoogleAuthProvider();


    // ELEMENTOS
    const registerBtn = document.getElementById("registerBtn");
    const googleBtn = document.getElementById("googleBtn");

    const message = document.getElementById("message");


    // FUNCIÓN PARA MOSTRAR MENSAJES
    function showMessage(text, type) {

      message.textContent = text;

      message.className = "message " + type;

      message.style.display = "block";
    }


    // CREAR CUENTA
    registerBtn.addEventListener("click", async () => {

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;


      // VALIDAR NOMBRE
      if (!name) {
        showMessage("Escribe tu nombre.", "error");
        return;
      }


      // VALIDAR CORREO
      if (!email) {
        showMessage("Escribe tu correo electrónico.", "error");
        return;
      }


      // VALIDAR CONTRASEÑA
      if (!password) {
        showMessage("Escribe una contraseña.", "error");
        return;
      }


      if (password.length < 6) {
        showMessage(
          "La contraseña debe tener al menos 6 caracteres.",
          "error"
        );
        return;
      }


      // CONFIRMAR CONTRASEÑA
      if (password !== confirmPassword) {
        showMessage(
          "Las contraseñas no coinciden.",
          "error"
        );
        return;
      }


      // CAMBIAR BOTÓN
      registerBtn.disabled = true;
      registerBtn.textContent = "Creando cuenta...";


      try {

        // CREAR USUARIO EN FIREBASE
        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user = userCredential.user;


        // GUARDAR NOMBRE DEL USUARIO
        await updateProfile(user, {
          displayName: name
        });


        showMessage(
          "¡Cuenta creada correctamente!",
          "success"
        );


        // ESPERAR Y REDIRIGIR
        setTimeout(() => {
          window.location.href = "index.html";
        }, 1500);


      } catch (error) {

        console.error(error);

        let errorMessage = "No se pudo crear la cuenta.";


        switch (error.code) {

          case "auth/email-already-in-use":
            errorMessage = "Ese correo ya está registrado.";
            break;

          case "auth/invalid-email":
            errorMessage = "El correo electrónico no es válido.";
            break;

          case "auth/weak-password":
            errorMessage = "La contraseña es demasiado débil.";
            break;

          case "auth/network-request-failed":
            errorMessage = "Error de conexión. Revisa tu internet.";
            break;

          case "auth/operation-not-allowed":
            errorMessage =
              "El registro con correo y contraseña no está activado en Firebase.";
            break;

          default:
            errorMessage =
              "Error: " + error.message;
        }


        showMessage(errorMessage, "error");


        registerBtn.disabled = false;
        registerBtn.textContent = "Crear cuenta";

      }

    });


    // GOOGLE
    googleBtn.addEventListener("click", async () => {

      googleBtn.disabled = true;
      googleBtn.textContent = "Conectando...";


      try {

        await signInWithPopup(auth, provider);


        showMessage(
          "¡Cuenta conectada con Google!",
          "success"
        );


        setTimeout(() => {
          window.location.href = "index.html";
        }, 1000);


      } catch (error) {

        console.error(error);

        let errorMessage = "No se pudo iniciar con Google.";


        switch (error.code) {

          case "auth/popup-closed-by-user":
            errorMessage = "Cerraste la ventana de Google.";
            break;

          case "auth/popup-blocked":
            errorMessage =
              "El navegador bloqueó la ventana de Google.";
            break;

          case "auth/unauthorized-domain":
            errorMessage =
              "Este dominio todavía no está autorizado en Firebase.";
            break;

          case "auth/account-exists-with-different-credential":
            errorMessage =
              "Ya existe una cuenta con ese correo.";
            break;

          default:
            errorMessage =
              "Error de Google: " + error.message;
        }


        showMessage(errorMessage, "error");

        googleBtn.disabled = false;
        googleBtn.textContent = "Continuar con Google";

      }

    });

  </script>

</body>
</html>
