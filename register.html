<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crear cuenta — NEXORA STORE</title>
  <link rel="icon" type="image/png" href="nexora-logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        #050608 url("register-bg.png")
        left center / cover
        no-repeat fixed;

      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .panel {
      width: 47%;
      min-height: 100vh;

      background: rgba(5, 7, 10, 0.97);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px 6%;

      box-shadow:
        -25px 0 80px rgba(0, 0, 0, 0.55);
    }

    .box {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      margin-bottom: 25px;
    }

    .brand img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
    }

    .brand span {
      font-size: 19px;
      font-weight: 800;
    }

    h1 {
      text-align: center;
      font-size: 34px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #8e95a3;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      color: #b8beca;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      height: 52px;

      padding: 0 16px;

      border: 1px solid #303642;
      border-radius: 11px;

      background: #11141a;
      color: #fff;

      outline: none;
      font-size: 15px;

      transition: 0.2s;
    }

    .field input:focus {
      border-color: #f26822;

      box-shadow:
        0 0 0 3px rgba(242, 104, 34, 0.12);
    }

    .primary,
    .google {
      width: 100%;
      height: 52px;

      border-radius: 11px;

      font-size: 14px;
      font-weight: 800;

      cursor: pointer;

      transition: 0.2s;
    }

    .primary {
      border: none;
      background: #f26822;
      color: #fff;
      margin-top: 5px;
    }

    .primary:hover {
      filter: brightness(1.08);
    }

    .google {
      border: 1px solid #303642;
      background: #11141a;
      color: #fff;
    }

    .google:hover {
      background: #181c24;
    }

    .primary:disabled,
    .google:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .or {
      display: flex;
      align-items: center;
      gap: 12px;

      color: #707785;
      font-size: 12px;

      margin: 18px 0;
    }

    .or::before,
    .or::after {
      content: "";

      height: 1px;
      background: #282d36;

      flex: 1;
    }

    .message {
      min-height: 20px;

      text-align: center;

      color: #ffae74;

      font-size: 13px;

      margin: 10px 0;
    }

    .login-link {
      text-align: center;

      color: #808795;

      font-size: 13px;

      margin-top: 22px;
    }

    .login-link a {
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 900px) {

      body {
        background: #080a0f;
      }

      .panel {
        width: 100%;
        min-height: 100vh;

        padding: 32px 7%;

        box-shadow: none;
      }
    }
  </style>
</head>

<body>

  <section class="panel">

    <div class="box">

      <div class="brand">
        <img
          src="nexora-logo.png"
          alt="NEXORA STORE"
        >

        <span>
          NEXORA STORE
        </span>
      </div>

      <h1>
        Crear una cuenta
      </h1>

      <p class="subtitle">
        Únete a NEXORA STORE y disfruta de nuestras recargas.
      </p>


      <form id="registerForm">

        <div class="field">

          <label for="name">
            Nombre completo
          </label>

          <input
            id="name"
            type="text"
            placeholder="Nombre completo"
            autocomplete="name"
            required
          >

        </div>


        <div class="field">

          <label for="email">
            Correo electrónico
          </label>

          <input
            id="email"
            type="email"
            placeholder="Correo electrónico"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Crear contraseña
          </label>

          <input
            id="password"
            type="password"
            placeholder="Crear contraseña"
            autocomplete="new-password"
            minlength="6"
            required
          >

        </div>


        <div class="field">

          <label for="confirmPassword">
            Confirmar contraseña
          </label>

          <input
            id="confirmPassword"
            type="password"
            placeholder="Confirmar contraseña"
            autocomplete="new-password"
            minlength="6"
            required
          >

        </div>


        <div
          id="message"
          class="message"
          aria-live="polite"
        ></div>


        <button
          id="registerButton"
          class="primary"
          type="submit"
        >
          Crear mi cuenta
        </button>

      </form>


      <div class="or">
        O
      </div>


      <button
        id="googleButton"
        class="google"
        type="button"
      >
        🔵 &nbsp; Registrarse con Google
      </button>


      <p class="login-link">

        ¿Ya tienes cuenta?

        <a href="login.html">
          Inicia sesión
        </a>

      </p>

    </div>

  </section>


  <script type="module">

    import {
      createUserWithEmailAndPassword,
      updateProfile,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    import {
      auth,
      googleProvider
    } from "./firebase.js";


    const form =
      document.getElementById("registerForm");

    const nameInput =
      document.getElementById("name");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const confirmPasswordInput =
      document.getElementById("confirmPassword");

    const registerButton =
      document.getElementById("registerButton");

    const googleButton =
      document.getElementById("googleButton");

    const message =
      document.getElementById("message");


    function showMessage(text) {
      message.textContent = text;
    }


    function getFirebaseError(error) {

      switch (error.code) {

        case "auth/email-already-in-use":
          return "Ese correo ya tiene una cuenta.";

        case "auth/invalid-email":
          return "El correo electrónico no es válido.";

        case "auth/weak-password":
          return "La contraseña es demasiado débil.";

        case "auth/password-does-not-meet-requirements":
          return "La contraseña no cumple los requisitos.";

        case "auth/operation-not-allowed":
          return "El registro con correo y contraseña no está habilitado en Firebase.";

        case "auth/network-request-failed":
          return "Error de conexión. Revisa tu Internet.";

        case "auth/popup-blocked":
          return "El navegador bloqueó la ventana de Google.";

        case "auth/popup-closed-by-user":
          return "La ventana de Google fue cerrada.";

        case "auth/unauthorized-domain":
          return "Este dominio no está autorizado en Firebase.";

        default:
          return "No se pudo crear la cuenta.";
      }
    }


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        showMessage("");

        const name =
          nameInput.value.trim();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        const confirmPassword =
          confirmPasswordInput.value;


        if (password !== confirmPassword) {

          showMessage(
            "Las contraseñas no coinciden."
          );

          return;
        }


        registerButton.disabled = true;


        try {

          const result =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          if (name) {

            await updateProfile(
              result.user,
              {
                displayName: name
              }
            );

          }


          showMessage(
            "Cuenta creada correctamente. Entrando..."
          );


          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 700);


        } catch (error) {

          console.error(
            "Error al crear cuenta:",
            error
          );

          showMessage(
            getFirebaseError(error) +
            " [" +
            error.code +
            "]"
          );


        } finally {

          registerButton.disabled = false;

        }

      }
    );


    googleButton.addEventListener(
      "click",
      async () => {

        showMessage("");

        googleButton.disabled = true;


        try {

          await signInWithPopup(
            auth,
            googleProvider
          );


          showMessage(
            "Cuenta de Google conectada. Entrando..."
          );


          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 700);


        } catch (error) {

          console.error(
            "Error con Google:",
            error
          );

          showMessage(
            getFirebaseError(error) +
            " [" +
            error.code +
            "]"
          );


        } finally {

          googleButton.disabled = false;

        }

      }
    );

  </script>

</body>
</html>
